spring.application.name=safemotion-backend
# Render (y otros hostings) indican el puerto con la variable PORT
server.port=${PORT:8080}

# ---- Firebase ----
# Proyecto de Firebase (el mismo de la PWA, el dashboard y el reloj)
app.firebase.project-id=${FIREBASE_PROJECT_ID:mesaayuda-a631d}
# Llave web de Firebase (es pública, la misma de la PWA): se usa para iniciar sesión con el PIN
app.firebase.api-key=${FIREBASE_API_KEY:}
# Si la llave web está restringida por sitio, las peticiones del servidor se identifican con este Referer
app.firebase.referer=${FIREBASE_REFERER:https://safemotion-pwa.vercel.app/}
# Credenciales de la cuenta de servicio: contenido JSON en FIREBASE_SERVICE_ACCOUNT_JSON,
# o ruta en GOOGLE_APPLICATION_CREDENTIALS. Con FIRESTORE_EMULATOR_HOST y FIREBASE_AUTH_EMULATOR_HOST
# se usa el emulador local y no hacen falta credenciales.

# ---- CORS: solo los sitios de SafeMotion ----
app.cors.origins=${CORS_ORIGINS:https://safemotion-pwa.vercel.app,https://safemotion-dashboard.vercel.app,http://localhost:5173,http://localhost:4173}

# Mensajes de validación en español ("debe ser menor que o igual a 220")
spring.web.locale=es_MX
spring.web.locale-resolver=fixed

# ---- Errores: nunca exponer la traza ni el mensaje interno ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
