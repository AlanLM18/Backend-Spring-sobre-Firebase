# Blueprint de Render para el backend de SafeMotion (Render > New > Blueprint, apuntando a este repositorio).
# La API queda en https://safemotion-backend.onrender.com y la PWA la publica en /api/** mediante su vercel.json.
services:
  - type: web
    name: safemotion-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/sistema/estado
    autoDeploy: true
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: mesaayuda-a631d
      # Llave web de Firebase (la misma VITE_FIREBASE_API_KEY de la PWA): se captura en el panel de Render
      - key: FIREBASE_API_KEY
        sync: false
      # Contenido completo del JSON de la cuenta de servicio (Firebase > Configuración > Cuentas de servicio).
      # Es secreto: se pega solo en el panel de Render, nunca en git.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        value: https://safemotion-pwa.vercel.app,https://safemotion-dashboard.vercel.app,http://localhost:5173
